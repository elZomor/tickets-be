services:
  db:
    image: postgres:14.5-alpine
    container_name: db
    environment:
      POSTGRES_PASSWORD: pgpassword
    volumes:
      - data:/var/lib/postgresql/data
      - ./database/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5533:5432"
    restart: always
    deploy:
      resources:
        limits:
          memory: 300M
          cpus: '0.25'
        reservations:
          memory: 200M
          cpus: '0.2'
  admin:
    container_name: admin
    build: .
    restart: always
    env_file:
      - .env
    ports:
      - "8005:8000"
    depends_on:
      - db
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 500M
          cpus: '0.5'
        reservations:
          memory: 300M
          cpus: '0.25'
  redis:
    image: redis:6
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 100M
          cpus: '0.25'
        reservations:
          memory: 50M
          cpus: '0.1'
  celery_worker:
    build: .
    container_name: celery_worker
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis
      - db
    env_file:
      - .env
    entrypoint: []
    restart: always
    deploy:
      resources:
        limits:
          memory: 200M
          cpus: '0.25'
        reservations:
          memory: 150M
          cpus: '0.1'
volumes:
  data:
